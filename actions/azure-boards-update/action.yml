name: 'Azure Boards Update'
description: 'Parse AB#<id> from text and update work item state in Azure Boards'

inputs:
  pr-title:
    description: 'Pull request title'
    required: true
  pr-body:
    description: 'Pull request body'
    required: false
    default: ''
  target-state:
    description: 'Target work item state (e.g., In Review, QA)'
    required: true
  azure-org:
    description: 'Azure DevOps organization'
    required: true
  azure-project:
    description: 'Azure DevOps project'
    required: true
  azure-pat:
    description: 'Azure DevOps PAT with Work Items R/W scope'
    required: true

outputs:
  work-item-ids:
    description: 'Comma-separated list of updated work item IDs'
    value: ${{ steps.update.outputs.ids }}

runs:
  using: 'composite'
  steps:
    - name: Update work items
      id: update
      shell: bash
      run: |
        # Parse AB#<id> from title and body
        IDS=$(printf '%s\n%s' "${{ inputs.pr-title }}" "${{ inputs.pr-body }}" | grep -oE 'AB#[0-9]+' | grep -oE '[0-9]+' | sort -u)

        if [ -z "$IDS" ]; then
          echo "No AB# references found"
          echo "ids=" >> $GITHUB_OUTPUT
          exit 0
        fi

        STATE="${{ inputs.target-state }}"
        echo "Found work items: $IDS"
        echo "Target state: $STATE"

        ORG="${{ inputs.azure-org }}"
        PROJECT="${{ inputs.azure-project }}"
        UPDATED=""

        for ID in $IDS; do
          HTTP_CODE=$(curl -s -o /tmp/ab_response.json -w "%{http_code}" \
            -u ":${{ inputs.azure-pat }}" \
            -X PATCH \
            -H "Content-Type: application/json-patch+json" \
            "https://dev.azure.com/$ORG/$PROJECT/_apis/wit/workitems/$ID?api-version=7.1" \
            -d "[{\"op\":\"replace\",\"path\":\"/fields/System.State\",\"value\":\"$STATE\"}]")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ AB#$ID → $STATE"
            [ -n "$UPDATED" ] && UPDATED="$UPDATED,$ID" || UPDATED="$ID"
          else
            echo "✗ AB#$ID failed ($HTTP_CODE)"
            cat /tmp/ab_response.json | head -3
          fi
        done

        echo "ids=$UPDATED" >> $GITHUB_OUTPUT
