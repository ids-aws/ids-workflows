name: Azure Boards Sync

on:
  workflow_call:
    inputs:
      target-state:
        description: 'Target work item state (e.g., In Review, QA)'
        required: true
        type: string
      pr-title:
        description: 'Pull request title containing AB#<id> references'
        required: true
        type: string
      pr-body:
        description: 'Pull request body (may contain AB#<id> references)'
        required: false
        type: string
        default: ''
      azure-org:
        description: 'Azure DevOps organization'
        required: false
        type: string
        default: 'INNOVAWST'
      azure-project:
        description: 'Azure DevOps project'
        required: false
        type: string
        default: 'ZenYaa'
    secrets:
      AZURE_DEVOPS_PAT:
        required: true

permissions:
  contents: read

jobs:
  sync:
    name: Update AB work items → ${{ inputs.target-state }}
    runs-on: ubuntu-latest
    steps:
      - uses: innovds/ids-workflows/actions/azure-boards-update@main
        with:
          pr-title: ${{ inputs.pr-title }}
          pr-body: ${{ inputs.pr-body }}
          target-state: ${{ inputs.target-state }}
          azure-org: ${{ inputs.azure-org }}
          azure-project: ${{ inputs.azure-project }}
          azure-pat: ${{ secrets.AZURE_DEVOPS_PAT }}
